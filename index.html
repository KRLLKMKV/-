<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра "Лабиринт"</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-image: url('cats.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .ui-panel {
            background-color: rgba(0, 0, 0, 0.75);
            padding: 12px 25px;
            border-radius: 15px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            backdrop-filter: blur(5px);
            display: flex;
            gap: 30px;
            z-index: 10;
        }
        .ui-panel .fish-count {
            color: #fffa65;
        }
        canvas {
            background-color: rgba(244, 164, 96, 0.95);
            border: 2px solid #000;
            border-radius: 10px;
            display: block;
        }
        .win-screen {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 30px 50px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 20;
        }
        .win-screen h1 {
            color: #008000;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="ui-panel">
        <div>Уровень: <span id="levelDisplay">1</span></div>
        <div class="fish-count">Осталось рыбок: <span id="fishDisplay">0</span></div>
    </div>

    <canvas id="gameCanvas" width="600" height="450"></canvas>

    <div class="win-screen" id="winScreen">
        <h1>Победа!</h1>
        <p>Вы собрали всю рыбку!</p>
    </div>

    <!-- ИСПРАВЛЕНО: правильные имена файлов скриптов -->
    <script src="HorizontalRedCube.js"></script>
    <script src="VerticalRedCube.js"></script>
    <script src="Player.js"></script>
    <script src="game.js"></script>

</body>
</html>
