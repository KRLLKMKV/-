<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактор уровней — Лабиринт</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }
        .panel {
            background: #313244;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .tools { width: 220px; }
        .tools h2 { font-size: 18px; margin-bottom: 15px; color: #89b4fa; }
        .tool-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 6px;
            border: 2px solid transparent;
            border-radius: 8px;
            background: #45475a;
            color: #cdd6f4;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.15s;
        }
        .tool-btn:hover { background: #585b70; }
        .tool-btn.active { border-color: #89b4fa; background: #45475a; }
        .tool-icon {
            width: 24px; height: 24px;
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 12px;
        }
        .icon-wall { background: #269926; color: white; }
        .icon-start { background: #00bfff; color: white; }
        .icon-exit { background: #2ed573; color: white; }
        .icon-fish { background: #FFB000; color: white; }
        .icon-enemy-e { background: #FF0000; color: white; }
        .icon-enemy-v { background: #FF4444; color: white; }
        .icon-eraser { background: #f4a261; color: white; }
        .action-btn {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #89b4fa;
            color: #1e1e2e;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.15s;
        }
        .action-btn:hover { background: #74c7ec; }
        .action-btn.danger { background: #f38ba8; }
        .action-btn.danger:hover { background: #eba0ac; }
        .action-btn.success { background: #a6e3a1; }
        .action-btn.success:hover { background: #94d98f; }

        .canvas-wrap { display: flex; flex-direction: column; align-items: center; }
        .canvas-wrap h2 { color: #89b4fa; margin-bottom: 15px; }
        #grid {
            display: grid;
            grid-template-columns: repeat(20, 30px);
            grid-template-rows: repeat(15, 30px);
            gap: 1px;
            background: #1e1e2e;
            border: 2px solid #585b70;
            border-radius: 4px;
            cursor: crosshair;
            user-select: none;
        }
        .cell {
            width: 30px; height: 30px;
            background: #f4a261;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold;
            transition: background 0.05s;
        }
        .cell.wall { background: #269926; }
        .cell.start { background: #00bfff; }
        .cell.exit { background: #2ed573; }
        .cell.fish { background: #f4a261; }
        .cell.enemy-e { background: #f4a261; }
        .cell.enemy-v { background: #f4a261; }

        .output { width: 320px; }
        .output h2 { font-size: 18px; margin-bottom: 15px; color: #89b4fa; }
        textarea {
            width: 100%;
            height: 200px;
            background: #1e1e2e;
            color: #cdd6f4;
            border: 1px solid #585b70;
            border-radius: 8px;
            padding: 10px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            resize: vertical;
        }
        .status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            min-height: 36px;
        }
        .status.ok { background: #a6e3a1; color: #1e1e2e; }
        .status.err { background: #f38ba8; color: #1e1e2e; }
        .status.info { background: #89b4fa; color: #1e1e2e; }
        .hint { font-size: 12px; color: #a6adc8; margin-top: 10px; line-height: 1.5; }
        
        /* Мини-превью для тестирования */
        #preview {
            margin-top: 15px;
            border: 2px solid #585b70;
            border-radius: 4px;
            background: #f4a261;
            display: none;
        }
    </style>
</head>
<body>

    <!-- ПАНЕЛЬ ИНСТРУМЕНТОВ -->
    <div class="panel tools">
        <h2>🛠️ Инструменты</h2>
        <button class="tool-btn active" data-tool="wall">
            <span class="tool-icon icon-wall">1</span> Стена
        </button>
        <button class="tool-btn" data-tool="start">
            <span class="tool-icon icon-start">2</span> Старт
        </button>
        <button class="tool-btn" data-tool="exit">
            <span class="tool-icon icon-exit">3</span> Выход
        </button>
        <button class="tool-btn" data-tool="fish">
            <span class="tool-icon icon-fish">F</span> Рыбка
        </button>
        <button class="tool-btn" data-tool="enemy-e">
            <span class="tool-icon icon-enemy-e">E</span> Враг →
        </button>
        <button class="tool-btn" data-tool="enemy-v">
            <span class="tool-icon icon-enemy-v">V</span> Враг ↕
        </button>
        <button class="tool-btn" data-tool="eraser">
            <span class="tool-icon icon-eraser">.</span> Ластик
        </button>

        <h2 style="margin-top:20px;">⚡ Действия</h2>
        <button class="action-btn danger" id="btnClear">🗑️ Очистить всё</button>
        <button class="action-btn" id="btnFillWalls">🧱 Заполнить стенами</button>
        <button class="action-btn success" id="btnValidate">✅ Проверить уровень</button>
    </div>

    <!-- СЕТКА -->
    <div class="panel canvas-wrap">
        <h2>🎮 Сетка 20×15</h2>
        <div id="grid"></div>
        <canvas id="preview" width="600" height="450"></canvas>
        <div class="hint">
            💡 Зажмите кнопку мыши и водите по сетке, чтобы рисовать.<br>
            ПКМ по клетке — быстрый ластик.
        </div>
    </div>

    <!-- ЭКСПОРТ / ИМПОРТ -->
    <div class="panel output">
        <h2>📤 Экспорт / Импорт</h2>
        <textarea id="codeArea" placeholder="Вставьте сюда строку уровня из game.js..."></textarea>
        <button class="action-btn success" id="btnImport">⬇️ Импортировать из текста</button>
        <button class="action-btn" id="btnExport">⬆️ Экспортировать в код</button>
        <button class="action-btn" id="btnCopy">📋 Скопировать код</button>
        <div class="status info" id="status">Готов к работе</div>
        <div class="hint">
            📝 Скопированный код можно вставить в массив <code>levelStrings</code> в файле <code>game.js</code>.
        </div>
    </div>

<script>
const COLS = 20, ROWS = 15;
const grid = document.getElementById('grid');
const cells = [];
let currentTool = 'wall';
let isDrawing = false;

// Символы для каждого инструмента
const toolToChar = {
    'wall': '1', 'start': '2', 'exit': '3',
    'fish': 'F', 'enemy-e': 'E', 'enemy-v': 'V', 'eraser': '.'
};

// Инициализация сетки
function initGrid() {
    grid.innerHTML = '';
    cells.length = 0;
    for (let r = 0; r < ROWS; r++) {
        cells[r] = [];
        for (let c = 0; c < COLS; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.r = r;
            cell.dataset.c = c;
            grid.appendChild(cell);
            cells[r][c] = cell;
        }
    }
    // По умолчанию заполняем стенами по краям
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (r === 0 || r === ROWS-1 || c === 0 || c === COLS-1) {
                setCell(r, c, 'wall');
            } else {
                setCell(r, c, 'eraser');
            }
        }
    }
}

function setCell(r, c, tool) {
    const cell = cells[r][c];
    cell.className = 'cell ' + (tool === 'eraser' ? '' : tool);
    cell.dataset.tool = tool;
    cell.textContent = tool === 'eraser' ? '' : toolToChar[tool];
}

function getCellTool(r, c) {
    return cells[r][c].dataset.tool || 'eraser';
}

// Обработка рисования
function paint(r, c) {
    setCell(r, c, currentTool);
}

grid.addEventListener('mousedown', (e) => {
    e.preventDefault();
    isDrawing = true;
    const r = +e.target.dataset.r, c = +e.target.dataset.c;
    if (isNaN(r)) return;
    if (e.button === 2) {
        // ПКМ — ластик
        const oldTool = currentTool;
        currentTool = 'eraser';
        paint(r, c);
        currentTool = oldTool;
    } else {
        paint(r, c);
    }
});
grid.addEventListener('mouseover', (e) => {
    if (!isDrawing) return;
    const r = +e.target.dataset.r, c = +e.target.dataset.c;
    if (isNaN(r)) return;
    paint(r, c);
});
document.addEventListener('mouseup', () => isDrawing = false);
grid.addEventListener('contextmenu', e => e.preventDefault());

// Выбор инструмента
document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = btn.dataset.tool;
    });
});

// Очистить всё
document.getElementById('btnClear').addEventListener('click', () => {
    for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
            setCell(r, c, 'eraser');
    setStatus('Поле очищено', 'info');
});

// Заполнить стенами
document.getElementById('btnFillWalls').addEventListener('click', () => {
    for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
            setCell(r, c, 'wall');
    setStatus('Поле заполнено стенами', 'info');
});

// Проверка уровня
document.getElementById('btnValidate').addEventListener('click', () => {
    let starts = 0, exits = 0, fishes = 0, enemies = 0;
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const t = getCellTool(r, c);
            if (t === 'start') starts++;
            if (t === 'exit') exits++;
            if (t === 'fish') fishes++;
            if (t === 'enemy-e' || t === 'enemy-v') enemies++;
        }
    }
    const errors = [];
    if (starts === 0) errors.push('❌ Нет стартовой позиции (2)');
    if (starts > 1) errors.push('⚠️ Несколько стартовых позиций');
    if (exits === 0) errors.push('❌ Нет выхода (3)');
    if (fishes === 0) errors.push('⚠️ Нет рыбок — уровень непроходим');
    if (enemies === 0) setStatus(`✅ Уровень валиден! Старт:1, Выход:1, Рыбок:${fishes}, Врагов:0`, 'ok');
    else setStatus(`✅ Уровень валиден! Старт:1, Выход:1, Рыбок:${fishes}, Врагов:${enemies}`, 'ok');
    if (errors.length) setStatus(errors.join('<br>'), 'err');
});

// Экспорт в код
document.getElementById('btnExport').addEventListener('click', () => {
    let lines = [];
    for (let r = 0; r < ROWS; r++) {
        let line = '';
        for (let c = 0; c < COLS; c++) {
            const t = getCellTool(r, c);
            line += toolToChar[t];
        }
        lines.push('"' + line + '"');
    }
    const result = lines.join(' +\n    ');
    document.getElementById('codeArea').value = result;
    setStatus('✅ Код экспортирован! Нажмите "Скопировать"', 'ok');
});

// Импорт из кода
document.getElementById('btnImport').addEventListener('click', () => {
    const text = document.getElementById('codeArea').value.trim();
    // Извлекаем все строки в кавычках
    const matches = text.match(/"([^"]{20})"/g);
    if (!matches || matches.length !== ROWS) {
        setStatus(`❌ Нужно ровно ${ROWS} строк по ${COLS} символов. Найдено: ${matches ? matches.length : 0}`, 'err');
        return;
    }
    const charToTool = {
        '1': 'wall', '2': 'start', '3': 'exit',
        'F': 'fish', 'E': 'enemy-e', 'V': 'enemy-v', '.': 'eraser'
    };
    for (let r = 0; r < ROWS; r++) {
        const line = matches[r].slice(1, -1);
        for (let c = 0; c < COLS; c++) {
            const ch = line[c];
            setCell(r, c, charToTool[ch] || 'eraser');
        }
    }
    setStatus('✅ Уровень импортирован!', 'ok');
});

// Копировать в буфер
document.getElementById('btnCopy').addEventListener('click', async () => {
    const text = document.getElementById('codeArea').value;
    if (!text) { setStatus('❌ Сначала нажмите "Экспортировать"', 'err'); return; }
    try {
        await navigator.clipboard.writeText(text);
        setStatus('📋 Код скопирован в буфер обмена!', 'ok');
    } catch {
        setStatus('❌ Не удалось скопировать. Выделите текст вручную.', 'err');
    }
});

function setStatus(msg, type) {
    const s = document.getElementById('status');
    s.innerHTML = msg;
    s.className = 'status ' + type;
}

initGrid();
</script>
</body>
</html>
